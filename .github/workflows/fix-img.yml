name: Fix post images
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx
      - name: Fix images
        env:
          WP_BASE_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASS }}
        run: python fix_images.py
